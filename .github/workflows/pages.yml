name: TamaPoke MoRetro - Build + Web Flasher

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "tamapoke-pages"
  cancel-in-progress: true

jobs:
  build:
    name: Compiler et verifier TamaPoke
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v6

      - name: Installer Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Installer ESP32
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Installer les bibliotheques TamaPoke
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "GFX Library for Arduino"
          arduino-cli lib install "SensorLib"
          arduino-cli lib install "XPowersLib"

      - name: Compiler le firmware
        run: |
          chmod +x tools/build_web.sh
          bash tools/build_web.sh

      - name: Verifier le Web Flasher et les binaires
        run: |
          python3 tools/verify_web.py

      - name: Conserver une copie du firmware compile
        uses: actions/upload-artifact@v4
        with:
          name: TamaPoke-MoRetro-firmware
          path: |
            web/firmware/*.bin
            web/manifest.json
          if-no-files-found: error

      - name: Preparer le site pour GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

  deploy:
    name: Publier le Web Flasher
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v6

      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
