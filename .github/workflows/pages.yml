name: Build firmware + deploy web flasher

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Configure ESP32 board manager
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install TamaPoke libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "GFX Library for Arduino"
          arduino-cli lib install "SensorLib"
          arduino-cli lib install "XPowersLib"

      - name: Compile firmware and rebuild web binaries
        run: |
          chmod +x tools/build_web.sh
          bash tools/build_web.sh

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload web flasher
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
