name: PokeTama Moretro3D - Firmware et page Web

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "tamapoke-pages"
  cancel-in-progress: true

jobs:
  build:
    name: Compiler et verifier PokeTama
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v6

      - name: Tests moteur hors matériel
        run: |
          make -C tests clean
          make -C tests test

      - name: Audit final V9
        run: |
          python3 tools/audit_final_v9.py

      - name: Installer Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Cache Arduino ESP32
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-esp32-3.3.11-${{ runner.os }}-v2
          restore-keys: |
            arduino-esp32-3.3.11-${{ runner.os }}-

      - name: Installer ESP32 avec retry
        shell: bash
        run: |
          set -e
          arduino-cli config init || true
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

          for attempt in 1 2 3 4; do
            echo "Installation ESP32 3.3.11 - tentative ${attempt}/4"
            if arduino-cli core update-index && arduino-cli core install esp32:esp32@3.3.11; then
              echo "ESP32 core installe."
              break
            fi

            if [ "$attempt" -eq 4 ]; then
              echo "Echec apres 4 tentatives."
              exit 1
            fi

            wait_seconds=$((attempt * 15))
            echo "Nouvelle tentative dans ${wait_seconds}s..."
            sleep "$wait_seconds"
          done

          arduino-cli core list

      - name: Installer les bibliotheques PokeTama
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "GFX Library for Arduino"
          arduino-cli lib install "SensorLib"
          arduino-cli lib install "XPowersLib"

      - name: Installer les dependances Python des sprites
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install Pillow
          python3 -c "from PIL import Image; print('Pillow OK:', Image.__version__)"

      - name: Cache sprites PMD Johto
        uses: actions/cache@v4
        with:
          path: |
            tools/pmd_cache
            tools/sdcard/mons
          key: tamapoke-pmd-386-v9

      - name: Compiler le firmware
        run: |
          chmod +x tools/build_web.sh
          bash tools/build_web.sh

      - name: Verifier le Web Flasher et les binaires
        run: |
          python3 tools/verify_web.py

      - name: Conserver une copie du firmware compile
        uses: actions/upload-artifact@v4
        with:
          name: PokeTama-Moretro3D-V9.42-firmware
          path: |
            web/firmware/*.bin
            web/manifest.json
          if-no-files-found: error

      - name: Preparer le site pour GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

  deploy:
    name: Publier le Web Flasher
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v6

      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
